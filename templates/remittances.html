{% extends 'base.html' %}

{% block title %}Remittances - Infanta Arena{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-3xl font-bold text-white">Remittances</h2>
            <p class="text-slate-400 mt-1">Track cash remittances and payouts</p>
        </div>
        <a href="/remittances/new" class="px-6 py-3 bg-gold-500 hover:bg-gold-600 text-white rounded-lg font-medium shadow-lg transition">+ New Remittance</a>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl overflow-hidden">
        <div class="px-8 py-6 border-b border-slate-700/50 bg-slate-900/50">
            <h3 class="text-xl font-bold text-white">Recent Remittances</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-slate-900/50">
                    <tr class="border-b border-slate-700/50">
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Date</th>
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Amount</th>
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Recipient</th>
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Notes</th>
                        <th class="px-8 py-4 text-right text-slate-400 font-semibold text-sm">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-700/30 hover:bg-slate-700/20 transition">
                        <td class="px-8 py-4 text-slate-300">No remittances yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
