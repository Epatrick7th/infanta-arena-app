{% extends 'base.html' %}
{% block title %}New Personnel - Infanta Arena{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Add Worker</h2>
        <p class="text-slate-400">Register a new personnel/worker</p>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Full Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="e.g., Juan Dela Cruz">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Position</label>
                <select name="position" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
                    <option value="">-- Select Position --</option>
                    <option value="Handler">Handler</option>
                    <option value="Admin">Admin</option>
                    <option value="Security">Security</option>
                    <option value="Staff">Staff</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Daily Rate (₱)</label>
                <input type="number" name="daily_rate" step="0.01" min="0" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="0.00">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Contact</label>
                <input type="text" name="contact" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Phone or email (optional)">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Status</label>
                <select name="status" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 py-3 btn-primary text-white rounded-lg font-semibold shadow-lg transition">Add Worker</button>
                <a href="/personnel" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold text-center transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
