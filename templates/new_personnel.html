{% extends 'base.html' %}
{% block title %}Add Personnel - Sabong Arena Hub{% endblock %}
{% block content %}
<h1>👥 Add Personnel</h1>

<div class="card" style="max-width: 600px;">
  <form method="post">
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Position</label>
      <select name="position" required>
        <option value="">-- Select --</option>
        <option value="Admin">Admin</option>
        <option value="Handler">Handler</option>
        <option value="Security">Security</option>
        <option value="Staff">Staff</option>
      </select>
    </div>
    <div class="form-group">
      <label>Contact Number</label>
      <input type="text" name="contact">
    </div>
    <div class="form-group">
      <label>Date Hired</label>
      <input type="date" name="date_hired">
    </div>
    <div class="form-group">
      <label>Rate per Shift (₱)</label>
      <input type="number" name="rate" step="0.01">
    </div>
    <button type="submit" class="btn">Add Personnel</button>
    <a href="{{ url_for('personnel_page') }}" class="btn" style="background: #95a5a6;">Cancel</a>
  </form>
</div>
{% endblock %}
