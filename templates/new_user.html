{% extends 'base.html' %}
{% block title %}New User - Infanta Arena{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Create New User</h2>
        <p class="text-slate-400">Add a new system user</p>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="e.g., john_doe">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Min. 6 characters">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Role</label>
                <select name="role" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
                    <option value="">-- Select Role --</option>
                    <option value="super_admin">Super Admin</option>
                    <option value="admin">Admin</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 py-3 btn-primary text-white rounded-lg font-semibold shadow-lg transition">Create User</button>
                <a href="/users" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold text-center transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
