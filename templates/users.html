{% extends 'base.html' %}
{% block title %}Users Management - Infanta Arena{% endblock %}
{% block content %}

<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-3xl font-bold text-white">User Management</h2>
            <p class="text-slate-400 mt-1">Manage system users and roles</p>
        </div>
        <a href="/users/new" class="px-6 py-3 btn-primary text-white rounded-lg font-medium shadow-lg">+ New User</a>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl overflow-hidden">
        <div class="px-8 py-6 border-b border-slate-700/50 bg-slate-900/50">
            <h3 class="text-xl font-bold text-white">Users</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-slate-900/50">
                    <tr class="border-b border-slate-700/50">
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Username</th>
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Role</th>
                        <th class="px-8 py-4 text-left text-slate-400 font-semibold text-sm">Created</th>
                        <th class="px-8 py-4 text-right text-slate-400 font-semibold text-sm">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-700/30 hover:bg-slate-700/20 transition">
                        <td colspan="4" class="px-8 py-8 text-center text-slate-400">No users yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
