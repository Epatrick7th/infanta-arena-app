{% extends 'base.html' %}
{% block title %}New Event - Infanta Arena{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Create New Event</h2>
        <p class="text-slate-400">Set up a new cockfighting event</p>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Event Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="e.g., August Championship">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Event Date</label>
                <input type="date" name="event_date" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Event Type</label>
                <select name="event_type" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
                    <option value="hackfight">Hackfight</option>
                    <option value="derby" selected>Derby</option>
                    <option value="tournament">Tournament</option>
                    <option value="special">Special</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Location</label>
                <input type="text" name="location" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Main Arena">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Notes</label>
                <textarea name="notes" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Additional details..." rows="3"></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 py-3 btn-primary text-white rounded-lg font-semibold shadow-lg transition">Create Event</button>
                <a href="/events" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold text-center transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
