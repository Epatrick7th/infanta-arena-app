{% extends 'base.html' %}
{% block title %}New Remittance - Infanta Arena{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Create Remittance</h2>
        <p class="text-slate-400">Record a cash remittance or payout</p>
    </div>

    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/50 rounded-xl shadow-xl p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Date</label>
                <input type="date" name="date" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Amount (₱)</label>
                <input type="number" name="amount" step="0.01" min="0" required class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="0.00">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Recipient/Description</label>
                <input type="text" name="recipient" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Who received this remittance?">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Notes</label>
                <textarea name="notes" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-arena-500 focus:ring-2 focus:ring-arena-500/20 transition" placeholder="Optional notes..." rows="3"></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 py-3 bg-gold-500 hover:bg-gold-600 text-white rounded-lg font-semibold shadow-lg transition">Record Remittance</button>
                <a href="/remittances" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold text-center transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
