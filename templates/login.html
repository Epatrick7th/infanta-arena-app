{% extends 'base.html' %}
{% block title %}Login - Sabong Arena Hub{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
  <h1 style="text-align: center; margin-bottom: 1.5rem;">🐓 Sabong Arena Hub</h1>
  
  <form method="post">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn" style="width: 100%; text-align: center;">Login</button>
  </form>
  
  <div style="margin-top: 1rem; text-align: center; color: #7f8c8d; font-size: 0.9rem;">
    No account? <a href="{{ url_for('register') }}" style="color: #3498db;">Create one</a>
  </div>
</div>
{% endblock %}
